name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compilar
        run: dotnet build PadronizadorTI.sln -c Release

      - name: Publicar executável (configuração de exemplo)
        run: dotnet publish src/PadronizadorTI -p:PublishProfile=win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: PadronizadorTI-win-x64
          path: dist/PadronizadorTI/
